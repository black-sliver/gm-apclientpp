name: Build MSBuild

on:
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: 'write'
  attestations: 'write'

jobs:
  build-msbuild:
    # TODO: automated testing
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-2022
            sln: vs2022
            platform: win32
          - os: windows-2022
            sln: vs2022
            platform: win64
      fail-fast: false

    steps:
      - name: Set env win32
        if: |
          matrix.platform == 'win32'
        shell: bash
        run: |
          echo "ARCH=win32" >> $GITHUB_ENV
          echo "BUILD_PLATFORM=x86" >> $GITHUB_ENV
          echo "BUILD_CONFIGURATION=Release" >> $GITHUB_ENV
          echo "OPENSSL_BUILD_PLATFORM=VC-WIN32" >> $GITHUB_ENV

      - name: Set env win64
        if: |
          matrix.platform == 'win64'
        shell: bash
        run: |
          echo "ARCH=win64" >> $GITHUB_ENV
          echo "BUILD_PLATFORM=x64" >> $GITHUB_ENV
          echo "BUILD_CONFIGURATION=Release" >> $GITHUB_ENV
          echo "OPENSSL_BUILD_PLATFORM=VC-WIN64A" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Install build tools v140
        if: |
          matrix.sln == 'vs2015'
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" -OutFile "vs_BuildTools.exe"
          Start-Process -FilePath ./vs_BuildTools.exe -ArgumentList "--add", "Microsoft.VisualStudio.Component.VC.140", "--quiet", "--norestart", "--force", "--wait" -Wait -PassThru

      - name: MSVC Dev Cmd (VS2015)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        if: |
          matrix.sln == 'vs2015'
        with:
          arch: ${{env.ARCH}}
          toolset: '14.0'

      - name: MSVC Dev Cmd (VS2022)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        if: |
          matrix.sln == 'vs2022'
        with:
          arch: ${{env.ARCH}}

      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b  # v1.5.2

      - name: Install Perl
        uses: shogo82148/actions-setup-perl@v1.44.2  # immutable release

      - name: Build OpenSSL
        env:
          TERM: ansi
        run: |
          md dep
          cd dep
          git clone -b openssl-3.0.21 --depth 1 https://github.com/openssl/openssl.git
          cd openssl
          md ${{env.BUILD_PLATFORM}}
          cd ${{env.BUILD_PLATFORM}}
          perl ..\Configure ${{env.OPENSSL_BUILD_PLATFORM}} no-shared
          nmake /S

      - name: Build zlib
        run: |
          cd dep
          git clone -b v1.3.1 --depth 1 https://github.com/madler/zlib.git
          cd zlib
          nmake -f win32/Makefile.msc
          md ${{env.BUILD_PLATFORM}}
          move *.dll ${{env.BUILD_PLATFORM}}
          move *.lib ${{env.BUILD_PLATFORM}}

      - name: Build Project
        run: |
          msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{matrix.sln}} /p:Platform=${{env.BUILD_PLATFORM}}

      - name: Move Output
        if: |
          matrix.platform == 'win64'
        run: |
          # no idea why OutputPath isn't working
          md ${{matrix.sln}}\${{env.BUILD_CONFIGURATION}}
          cp ${{matrix.sln}}\x64\${{env.BUILD_CONFIGURATION}}\*.dll ${{matrix.sln}}\${{env.BUILD_CONFIGURATION}}
          dir ${{matrix.sln}}\${{env.BUILD_CONFIGURATION}}

      - name: Package
        run: Compress-Archive -Path ${{matrix.sln}}\${{env.BUILD_CONFIGURATION}}\gm-apclientpp.dll -DestinationPath gm-apclientpp-${{matrix.platform}}.zip

      - name: Attest Build and Zip
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            ${{matrix.sln}}\${{env.BUILD_CONFIGURATION}}\gm-apclientpp.dll
            gm-apclientpp-${{matrix.platform}}.zip

      - name: Store
        uses: actions/upload-artifact@v7.0.1
        with:
          path: gm-apclientpp-${{matrix.platform}}.zip
          archive: false
          if-no-files-found: error
